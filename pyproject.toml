[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mulat"
version = "0.1.0"
description = "Kubernetes multi-agent troubleshooter (LangGraph + FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "kubernetes>=31",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
postgres = [
    "langgraph-checkpoint-postgres>=2",
    "psycopg[binary]>=3",
]

[project.scripts]
mulat = "mulat.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mulat = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
