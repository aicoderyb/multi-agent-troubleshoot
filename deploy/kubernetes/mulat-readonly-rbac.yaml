# Read-only RBAC for Postman / mulat tools (see Tool_API.md).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mulat-reader
  namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mulat-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mulat-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mulat-reader
subjects:
  - kind: ServiceAccount
    name: mulat-reader
    namespace: ai-agents
