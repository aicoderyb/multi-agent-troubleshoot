apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-agents
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: changeme
            - name: POSTGRES_DB
              value: mulat
